<script>
  // Apply the saved light/dark choice before the page paints (avoids a flash).
  try { var t = localStorage.getItem('bm.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
